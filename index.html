<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaike Pampa - Ropa de Trabajo</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f4f4f4; }
        header { background: #222; color: white; padding: 30px 20px; text-align: center; }
        header h1 { margin: 0; font-size: 2.5em; letter-spacing: 2px; }
        nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; background: #333; padding: 15px; }
        nav button { background: none; border: none; color: white; cursor: pointer; font-size: 14px; font-weight: bold; padding: 5px 10px; transition: 0.3s; }
        nav button:hover { color: #f39c12; border-bottom: 2px solid #f39c12; }
        .catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding: 30px; max-width: 1200px; margin: auto; }
        .tarjeta { background: white; padding: 15px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tarjeta img { width: 100%; height: 250px; object-fit: cover; border-radius: 5px; }
        .tarjeta h3 { margin: 10px 0 5px; font-size: 1.1em; color: #333; }
        .tarjeta p { margin: 0; color: #666; font-size: 0.9em; }
        .tarjeta h2 { color: #27ae60; margin: 10px 0; }
        .btn-agregar { background: #333; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; border-radius: 5px; font-weight: bold; transition: 0.3s; }
        .btn-agregar:hover { background: #27ae60; }
        .carrito-flotante { position: fixed; bottom: 20px; right: 20px; background: #25d366; color: white; padding: 15px 20px; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.3s; z-index: 1000; }
        .carrito-flotante:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <header>
        <!-- Acá luego pondremos el logo real con un <img src="..."> -->
        <h1>KAIKE PAMPA</h1>
        <p>Ropa de Trabajo y Seguridad</p>
    </header>
    
    <nav>
        <button onclick="filtrar('Todas')">TODAS</button>
        <button onclick="filtrar('Chombas')">CHOMBAS</button>
        <button onclick="filtrar('Pantalones')">PANTALONES</button>
        <button onclick="filtrar('Camisas')">CAMISAS</button>
        <button onclick="filtrar('Seguridad')">SEGURIDAD</button>
    </nav>

    <div class="catalogo" id="contenedor-productos">Cargando catálogo...</div>
    
    <div class="carrito-flotante" onclick="enviarPedidoPorWhatsApp()">
        🛒 Enviar Pedido (<span id="contador-carrito">0</span>)
    </div>

    <script>
        // PEGAR TUS CREDENCIALES DE KAIKE PAMPA ACÁ
        const SUPABASE_URL = 'https://ibqypnfabfieikpxczdn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlicXlwbmZhYmZpZWlrcHhjemRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MjY3ODgsImV4cCI6MjA5NjUwMjc4OH0.0IxOrg6UILOM1yY58WdIUJYFGjDWx4EmXYNOv-JAOAg';
        const cliente = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let productosGlobales = [];
        let carrito = [];

        async function cargarProductos() {
            const { data, error } = await cliente.from('productos').select('*');
            if (error) {
                document.getElementById('contenedor-productos').innerHTML = '<p>Error al cargar los productos.</p>';
                return;
            }
            productosGlobales = data;
            mostrarProductos(data);
        }

        function mostrarProductos(productos) {
            const contenedor = document.getElementById('contenedor-productos');
            contenedor.innerHTML = '';
            if (productos.length === 0) {
                contenedor.innerHTML = '<p style="grid-column: 1 / -1; text-align: center;">No hay productos en esta categoría.</p>';
                return;
            }
            productos.forEach(prod => {
                // Si el artículo no tiene foto, pone una de relleno
                const foto = prod.foto_url ? prod.foto_url : 'https://via.placeholder.com/250x250?text=Sin+Imagen';
                
                contenedor.innerHTML += `
                    <div class="tarjeta">
                        <img src="${foto}" alt="${prod.nombre}">
                        <h3>${prod.nombre}</h3>
                        <p>Talle: ${prod.talle || '-'} | Color: ${prod.color || '-'}</p>
                        <h2>$${prod.precio}</h2>
                        <button class="btn-agregar" onclick="agregarAlCarrito('${prod.nombre}', '${prod.talle}', '${prod.color}', ${prod.precio})">Agregar</button>
                    </div>
                `;
            });
        }

        function filtrar(categoria) {
            if (categoria === 'Todas') {
                mostrarProductos(productosGlobales);
            } else {
                const filtrados = productosGlobales.filter(p => p.categoria.toLowerCase() === categoria.toLowerCase());
                mostrarProductos(filtrados);
            }
        }

        function agregarAlCarrito(nombre, talle, color, precio) {
            carrito.push({ nombre, talle, color, precio });
            document.getElementById('contador-carrito').innerText = carrito.length;
        }

        function enviarPedidoPorWhatsApp() {
            if (carrito.length === 0) {
                alert("Seleccioná al menos un producto para armar el pedido.");
                return;
            }
            
            // PONER EL NUMERO DE TELEFONO DE KAIKE PAMPA ACÁ (EJ: 5491123456789)
            const numeroWhatsApp = "549XXXXXXXXXX"; 
            
            let textoMensaje = "¡Hola! Quería consultar por el siguiente pedido:%0A%0A";
            let totalPedido = 0;

            carrito.forEach(articulo => {
                textoMensaje += `- ${articulo.nombre} (Talle: ${articulo.talle}, Color: ${articulo.color}) - $${articulo.precio}%0A`;
                totalPedido += parseFloat(articulo.precio);
            });

            textoMensaje += `%0A*Total aproximado: $${totalPedido}*%0A%0AAguardo confirmación de stock.`;
            
            const url = `https://wa.me/${numeroWhatsApp}?text=${textoMensaje}`;
            window.open(url, '_blank');
        }

        cargarProductos();
    </script>
</body>
</html>
